name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

# Keep only the newest run for a PR. Main pushes use the commit SHA as the
# group key, so every merged main commit still receives its own full CI run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  contract:
    # Every PR gets this cheap contract lane, including owner-authored PRs that
    # have not opted into the heavier `run-ci` jobs below. Keep it limited to
    # deterministic, in-process/static checks so feedback stays fast.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check frontend contracts
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run check:dist
      - name: Verify workspace boundaries
        run: |
          bash scripts/workspace_boundary_check.sh --self-test
          bash scripts/workspace_boundary_check.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check schema and metadata contracts
        run: |
          cargo test --locked -p webcodex --lib openapi_operation_ids_are_minimal
          cargo test --locked -p webcodex --lib openapi_all_local_refs_resolve
          cargo test --locked -p webcodex --lib explicit_resume_openapi_metadata_is_distinct_from_session_recording
          cargo test --locked -p webcodex --lib mcp_tools_list_returns_same_names_as_runtime
          cargo test --locked -p webcodex --lib mcp_tools_list_parity_with_rest_tools_list
          cargo test --locked -p webcodex --lib explicit_resume_mcp_schema_and_metadata_are_exposed
          cargo test --locked -p webcodex --lib http_project_connector_lists_and_dispatches_only_canonical_capabilities

  test:
    # External PRs run automatically (subject to GitHub's normal fork approval
    # protections). PRs authored by the repository owner are intentionally
    # opt-in: adding the `run-ci` label triggers this workflow again and enables
    # the heavy jobs. Removing the label also cancels an in-progress PR run via
    # the concurrency group above. Pushes to main always run.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.user.login != github.repository_owner ||
      contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Type-check frontend
        run: npm --prefix frontend run typecheck
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Verify committed frontend build
        run: npm --prefix frontend run check:dist
      - name: Verify workspace boundaries
        run: |
          bash scripts/workspace_boundary_check.sh --self-test
          bash scripts/workspace_boundary_check.sh
      - name: Test release verification tooling
        run: |
          python3 -m unittest scripts.tests.test_verify_public_release scripts.tests.test_collect_release_bundle scripts.tests.test_release_readiness scripts.tests.test_release_publication scripts.tests.test_check_markdown_links
          python3 -m py_compile scripts/verify_public_release.py scripts/collect_release_bundle.py scripts/release_readiness.py scripts/release_publication.py scripts/release_operator.py scripts/check_markdown_links.py
          python3 scripts/release_operator.py --help >/dev/null
          python3 scripts/release_operator.py preflight --help >/dev/null
          python3 scripts/release_operator.py readiness-start --help >/dev/null
          python3 scripts/release_operator.py readiness-status --help >/dev/null
          python3 scripts/release_operator.py build-start --help >/dev/null
          python3 scripts/release_operator.py build-status --help >/dev/null
          python3 scripts/release_operator.py collect --help >/dev/null
          python3 scripts/release_operator.py stage-npm --help >/dev/null
          python3 scripts/release_operator.py verify-draft --help >/dev/null
          python3 scripts/check_markdown_links.py
          bash -n scripts/npm_package_smoke.sh scripts/tests/test_npm_package_smoke_existing_binaries.sh
          bash scripts/npm_package_smoke.sh --help >/dev/null
          bash scripts/tests/test_npm_package_smoke_existing_binaries.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked --workspace

  test-windows:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.user.login != github.repository_owner ||
      contains(github.event.pull_request.labels.*.name, 'run-ci')
    # Windows release gate: the crates that must run natively on Windows 11
    # (CLI, Runner, persistent-shell's fail-closed gate, and the
    # cross-platform libraries they depend on), the npm distribution checks,
    # and the full Windows artifact -> npm install smoke. The Server and its
    # Unix-only runtime stay Linux-only.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked -p webcodex-agent-config -p webcodex-process -p webcodex-persistent-shell -p webcodex-cli -p webcodex-runner
      - name: Test npm installer and release manifest natively
        run: npm --prefix npm/webcodex test
      - name: Windows artifact to npm install smoke
        # Builds the three Windows binaries, packages the win32-x64 artifact
        # with the native PowerShell script, installs it through the npm
        # installer into a temporary prefix, and verifies the wrapper plus
        # --version/--help and the failure-preserves-old-binaries path. Never
        # touches the npm registry.
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/npm_install_windows_smoke.ps1
