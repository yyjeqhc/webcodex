services:
  webpi:
    # Source-build override. Set WEBPI_SERVER_IMAGE=webpi-server-local:reviewed
    # before Compose interpolates the mandatory image in compose.yaml.
    image: webpi-server-local:${WEBPI_IMAGE_TAG:-reviewed}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WEBPI_GIT_COMMIT: ${WEBPI_GIT_COMMIT:-}
        WEBPI_GIT_DIRTY: ${WEBPI_GIT_DIRTY:-}
        WEBPI_BUILT_AT: ${WEBPI_BUILT_AT:-}
