name: webpi

# An explicit WebPi image is required. There is no upstream binary fallback.
services:
  webpi:
    image: ${WEBPI_SERVER_IMAGE:?set an explicit reviewed WebPi image}
    pull_policy: always
    restart: unless-stopped
    environment:
      WEBPI_TOKEN: ${WEBPI_TOKEN:?set a WebPi-only token in .env}
      WEBPI_ADDR: 0.0.0.0:8080
      WEBPI_DATA: /var/lib/webpi
      WEBPI_PUBLIC_URL: ${WEBPI_PUBLIC_URL:?set the WebPi public origin in .env}
      WEBPI_SHARED_KEY_ENABLED: "false"
      WEBPI_ALLOW_ANONYMOUS: "false"
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # Only the host's existing reverse proxy should reach WebPi.
      - "127.0.0.1:${WEBPI_HOST_PORT:-56542}:8080"
    volumes:
      - webpi_data:/var/lib/webpi
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/openapi.json"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  webpi_data:
