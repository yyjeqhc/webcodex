[package]
name = "webcodex-browser"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
webcodex-core = { path = "../webcodex-core" }
base64 = "0.22"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tungstenite = "0.29"
url = "2"
uuid = { version = "1", features = ["v4"] }
webcodex-process = { path = "../webcodex-process" }
webcodex-runner-config = { path = "../webcodex-runner-config" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
