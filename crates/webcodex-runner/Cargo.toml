[package]
name = "webcodex-runner"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
webcodex-agent-config = { path = "../webcodex-agent-config" }
webcodex-core = { path = "../webcodex-core" }
webcodex-persistent-shell = { path = "../webcodex-persistent-shell" }
webcodex-process = { path = "../webcodex-process" }
webcodex-sandbox = { path = "../webcodex-sandbox" }
webcodex-workspace = { path = "../webcodex-workspace" }
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
flate2 = "1"
quinn = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
xml = "1"
webpki-roots = "0.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
image = { version = "0.25.9", default-features = false, features = ["jpeg"] }
xcap = { version = "0.9.8", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
] }

# Windows-native process liveness probe for MCP tests (OpenProcess +
# GetExitCodeProcess), the same probe approach webcodex-process already uses.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
