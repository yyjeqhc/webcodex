[package]
name = "webcodex-tool-contracts"
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
legacy-gpt-actions = []
experimental-code-mode = []
root-test-support = []
workspace-checkpoints = []

[dependencies]
webcodex-core = { path = "../webcodex-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.2"

[dev-dependencies]
regex = "1"
