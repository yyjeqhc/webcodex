[package]
name = "webcodex-validation"
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
# The Runner needs recipes/adapters, not the Server's Session evidence ledger.
session-evidence = ["dep:webcodex-tool-contracts", "dep:webcodex-workflow-session"]

[dependencies]
webcodex-core = { path = "../webcodex-core" }
webcodex-tool-contracts = { path = "../webcodex-tool-contracts", optional = true }
webcodex-workflow-session = { path = "../webcodex-workflow-session", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
webcodex-tool-contracts = { path = "../webcodex-tool-contracts", features = ["root-test-support"] }
webcodex-tool-runtime-contracts = { path = "../webcodex-tool-runtime-contracts" }
webcodex-workflow-session = { path = "../webcodex-workflow-session", features = ["root-test-support"] }
