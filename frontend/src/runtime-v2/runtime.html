<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f7" />
    <script>
      (() => {
        const appearanceKey = "webcodex.runtime.appearance.v1";
        const languageKey = "webcodex.runtime.language.v1";
        let appearance = "system";
        let language = navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh-CN" : "en";
        try {
          const storedAppearance = localStorage.getItem(appearanceKey);
          if (storedAppearance === "light" || storedAppearance === "dark" || storedAppearance === "system") appearance = storedAppearance;
          const storedLanguage = localStorage.getItem(languageKey);
          if (storedLanguage === "en" || storedLanguage === "zh-CN") language = storedLanguage;
        } catch {}
        const resolved = appearance === "system"
          ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : appearance;
        document.documentElement.dataset.theme = appearance;
        document.documentElement.dataset.resolvedTheme = resolved;
        document.documentElement.dataset.language = language;
        document.documentElement.lang = language;
      })();
    </script>
    <title>WebCodex — Runtime Workspace</title>
    <link rel="stylesheet" href="/runtime/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/runtime/app.js"></script>
  </body>
</html>
