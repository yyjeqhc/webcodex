<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WebCodex Goal Plan</title>
<style>
:root { color-scheme: light dark; font: 13px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; color: CanvasText; background: Canvas; }
.card { display: grid; gap: 10px; }
.header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
.badge { padding: 2px 7px; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); border-radius: 999px; font-size: 11px; white-space: nowrap; }
.steps { margin: 0; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 19em; overflow: auto; }
.checkpoint { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 7em; overflow: auto; }
.progress { font-weight: 600; }
.meta { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px 14px; font-size: 12px; color: color-mix(in srgb, CanvasText 72%, transparent); }
.meta b { color: CanvasText; font-weight: 600; }
.status { min-height: 1.4em; font-size: 11px; color: color-mix(in srgb, CanvasText 60%, transparent); }
.activity { padding: 7px 9px; border: 1px solid color-mix(in srgb, CanvasText 16%, transparent); border-radius: 7px; font-size: 12px; color: color-mix(in srgb, CanvasText 76%, transparent); }
.activity-attention_needed { border-style: dashed; color: CanvasText; }
.continuity { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px 14px; padding: 7px 9px; border: 1px solid color-mix(in srgb, CanvasText 16%, transparent); border-radius: 7px; font-size: 12px; color: color-mix(in srgb, CanvasText 76%, transparent); }
.continuity b { color: CanvasText; font-weight: 600; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="header"><h1 id="title">Goal</h1><span id="lifecycle" class="badge">Loading</span></div>
  <div id="progress" class="progress">Waiting for Goal state…</div>
  <pre id="steps" class="steps"></pre>
  <p id="checkpoint" class="checkpoint"></p>
  <div id="meta" class="meta" hidden>
    <span>Agent Tasks <b id="tasks">0</b></span>
    <span>Workflow Sessions <b id="sessions">0</b></span>
    <span>Controller <b id="controller">Not configured</b></span>
    <span>Revision <b id="revision">—</b></span>
    <span>Updated <b id="updated">—</b></span>
  </div>
  <div id="activity" class="activity" hidden></div>
  <div id="continuity" class="continuity" hidden>
    <span>Auto-resume <b id="auto-resume">—</b></span>
    <span>Continuity <b id="continuity-state">—</b></span>
    <span>Wake <b id="wake-state">—</b></span>
    <span>Host delivery <b id="host-delivery">—</b></span>
    <span>Fresh turn <b id="fresh-turn">—</b></span>
    <span>Last resume <b id="last-resume">—</b></span>
  </div>
  <div id="status" class="status">Initializing…</div>
</main>
<script>
(() => {
  "use strict";
  const GOAL_ID = /^wc_goal_[A-Za-z0-9_-]{16}$/;
  const AGENT_ID = /^wc_dagent_[A-Za-z0-9_-]{16}$/;
  const STEP_ID = /^[A-Za-z0-9_-]{1,32}$/;
  const STEP_STATES = new Set(["pending", "in_progress", "completed"]);
  const APP_PROTOCOL = "2026-01-26";
  const LIFECYCLES = new Set(["active", "completed", "cancelled"]);
  const ACTIVITY_STATES = new Set(["active", "attention_needed", "unobserved", "not_applicable"]);
  const CONTINUITY_STATES = new Set(["ready", "stalled", "wake_queued", "dispatching", "host_accepted", "host_unknown", "resume_confirmed", "not_configured", "not_applicable", "unavailable"]);
  const WAKE_STATES = new Set(["pending", "claimed", "prepared", "delivered", "delivery_unknown", "consumed", "retired"]);
  const HOST_DELIVERY_STATES = new Set(["not_started", "dispatching", "accepted", "unknown", "not_confirmed", "not_applicable"]);
  const FRESH_TURN_STATES = new Set(["not_confirmed", "confirmed", "not_applicable"]);
  const ACTIVITY_IDLE_THRESHOLD_MS = 300000;
  const OBSERVATION_LEASE_MS = 75000;
  const VISIBLE_NORMAL_POLL_MS = 12000;
  const HIDDEN_POLL_MS = 60000;
  const TRANSIENT_POLL_MS = 5000;
  const NEAR_ATTENTION_WINDOW_MS = 60000;
  const CALL_TIMEOUT_MS = 10000;
  let nextId = 1;
  let goalId = null;
  let lastRevision = 0;
  let lastLifecycle = null;
  let hostInitialized = false;
  let pollTimer = null;
  let pollInFlight = false;
  let lastPlan = null;
  let tornDown = false;
  const pending = new Map();
  const utf8Encoder = new TextEncoder();
  const el = id => document.getElementById(id);
  el("status").textContent = "App active · initializing Host";

  function send(method, params) {
    if (tornDown) return Promise.reject(new Error("App torn down"));
    const id = nextId++;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error("Host request timed out"));
      }, CALL_TIMEOUT_MS);
      pending.set(id, { resolve, reject, timer });
      parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    });
  }

  function notify(method, params) {
    if (!tornDown) parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
  }

  function validGoalId(value) {
    return typeof value === "string" && GOAL_ID.test(value);
  }

  function acceptIdentity(candidate) {
    if (tornDown) return false;
    if (!validGoalId(candidate) || (goalId && goalId !== candidate)) {
      teardown();
      el("status").textContent = "Invalid or conflicting Goal identity";
      return false;
    }
    goalId = candidate;
    return true;
  }

  function nullableSafeInteger(value) {
    return value === null || Number.isSafeInteger(value);
  }

  function validActivity(value) {
    if (!value || typeof value !== "object" || Array.isArray(value)) return false;
    if (typeof value.available !== "boolean" || !ACTIVITY_STATES.has(value.state)) return false;
    if (value.idle_threshold_ms !== ACTIVITY_IDLE_THRESHOLD_MS
      || value.observation_lease_ms !== OBSERVATION_LEASE_MS
      || typeof value.coverage_partial !== "boolean") return false;
    for (const key of ["last_seen_at_ms", "last_meaningful_activity_at_ms", "quiet_for_ms"]) {
      if (!nullableSafeInteger(value[key]) || (value[key] !== null && value[key] < 0 && key === "quiet_for_ms")) return false;
    }
    if (!(value.linked_window_count === null || (Number.isSafeInteger(value.linked_window_count) && value.linked_window_count >= 0 && value.linked_window_count <= 16))) return false;
    if (!(value.active_meaningful_request_count === null || (Number.isSafeInteger(value.active_meaningful_request_count) && value.active_meaningful_request_count >= 0 && value.active_meaningful_request_count <= 64))) return false;
    if (!value.available && [value.last_seen_at_ms, value.last_meaningful_activity_at_ms, value.quiet_for_ms, value.linked_window_count, value.active_meaningful_request_count].some(v => v !== null)) return false;
    return true;
  }

  function validContinuity(value) {
    if (!value || typeof value !== "object" || Array.isArray(value)) return false;
    if (typeof value.available !== "boolean" || !CONTINUITY_STATES.has(value.state)) return false;
    if (typeof value.production_auto_resume_available !== "boolean") return false;
    if (!(value.wake_state === null || WAKE_STATES.has(value.wake_state))) return false;
    if (!HOST_DELIVERY_STATES.has(value.host_delivery) || !FRESH_TURN_STATES.has(value.fresh_turn)) return false;
    if (!(value.last_resume_at_unix_ms === null || (Number.isSafeInteger(value.last_resume_at_unix_ms) && value.last_resume_at_unix_ms >= 0))) return false;
    for (const key of [
      "attention_candidate_at_unix_ms", "attention_created_at_unix_ms",
      "wake_created_at_unix_ms", "host_dispatch_prepared_at_unix_ms",
      "host_dispatch_accepted_at_unix_ms", "host_dispatch_unknown_at_unix_ms",
      "wake_consumed_at_unix_ms", "first_post_resume_meaningful_at_unix_ms",
      "last_post_resume_meaningful_at_unix_ms",
    ]) {
      if (!(value[key] === null || (Number.isSafeInteger(value[key]) && value[key] >= 0))) return false;
    }
    if (!value.available) {
      return value.state === "unavailable"
        && value.wake_state === null && value.host_delivery === "not_applicable"
        && value.fresh_turn === "not_applicable" && value.last_resume_at_unix_ms === null
        && value.attention_candidate_at_unix_ms === null
        && value.attention_created_at_unix_ms === null && value.wake_created_at_unix_ms === null
        && value.host_dispatch_prepared_at_unix_ms === null
        && value.host_dispatch_accepted_at_unix_ms === null
        && value.host_dispatch_unknown_at_unix_ms === null
        && value.wake_consumed_at_unix_ms === null
        && value.first_post_resume_meaningful_at_unix_ms === null
        && value.last_post_resume_meaningful_at_unix_ms === null;
    }
    if (value.state === "not_configured" || value.state === "not_applicable") {
      return !value.production_auto_resume_available && value.wake_state === null
        && value.host_delivery === "not_applicable" && value.fresh_turn === "not_applicable";
    }
    if (value.wake_state === null) {
      if (!(value.state === "ready" || value.state === "stalled")) return false;
      if (value.last_resume_at_unix_ms === null) {
        return value.host_delivery === "not_started" && value.fresh_turn === "not_confirmed";
      }
      if (value.fresh_turn !== "confirmed"
          || value.wake_consumed_at_unix_ms !== value.last_resume_at_unix_ms) return false;
      if (value.host_delivery === "accepted") {
        return value.host_dispatch_accepted_at_unix_ms !== null
          && value.host_dispatch_unknown_at_unix_ms === null;
      }
      if (value.host_delivery === "unknown") {
        return value.host_dispatch_accepted_at_unix_ms === null
          && value.host_dispatch_unknown_at_unix_ms !== null;
      }
      return value.host_delivery === "not_confirmed"
        && value.host_dispatch_accepted_at_unix_ms === null
        && value.host_dispatch_unknown_at_unix_ms === null;
    }
    if (value.wake_state === "pending" || value.wake_state === "claimed") {
      return value.state === "wake_queued" && value.host_delivery === "not_started"
        && value.fresh_turn === "not_confirmed";
    }
    if (value.wake_state === "prepared") {
      return value.state === "dispatching" && value.host_delivery === "dispatching"
        && value.fresh_turn === "not_confirmed";
    }
    if (value.wake_state === "delivered") {
      return value.state === "host_accepted" && value.host_delivery === "accepted"
        && value.fresh_turn === "not_confirmed";
    }
    if (value.wake_state === "delivery_unknown") {
      return value.state === "host_unknown" && value.host_delivery === "unknown"
        && value.fresh_turn === "not_confirmed";
    }
    if (value.wake_state === "retired") {
      return value.state === "stalled" && value.host_delivery === "not_started"
        && value.fresh_turn === "not_confirmed";
    }
    return value.wake_state === "consumed" && value.state === "resume_confirmed"
      && ["accepted", "unknown", "not_confirmed"].includes(value.host_delivery)
      && value.fresh_turn === "confirmed" && value.last_resume_at_unix_ms !== null;
  }

  function validPlan(value) {
    if (!value || typeof value !== "object") return null;
    if (value.version !== 3 || !validGoalId(value.goal_id)) return null;
    if (typeof value.title !== "string" || Array.from(value.title).length < 1 || Array.from(value.title).length > 200) return null;
    if (!Array.isArray(value.steps) || value.steps.length > 32 || value.total_step_count !== value.steps.length) return null;
    const ids = new Set();
    let completed = 0;
    let current = null;
    for (const step of value.steps) {
      if (!step || typeof step !== "object" || typeof step.id !== "string" || !STEP_ID.test(step.id) || ids.has(step.id)) return null;
      ids.add(step.id);
      if (typeof step.title !== "string" || Array.from(step.title).length < 1 || Array.from(step.title).length > 120) return null;
      if (!STEP_STATES.has(step.status) || !Number.isSafeInteger(step.updated_at_unix_ms)) return null;
      if (step.status === "completed") completed++;
      if (step.status === "in_progress") {
        if (current !== null) return null;
        current = step.id;
      }
    }
    if (value.completed_step_count !== completed || value.current_step_id !== current) return null;
    if (value.lifecycle === "completed" && completed !== value.steps.length) return null;
    if (value.progress_summary === null) {
      if (value.checkpoint_at_unix_ms !== null) return null;
    } else if (typeof value.progress_summary !== "string" || !value.progress_summary.trim()
      || utf8Encoder.encode(value.progress_summary).length > 2048 || !Number.isSafeInteger(value.checkpoint_at_unix_ms)) return null;
    if (utf8Encoder.encode(JSON.stringify(value)).length > 40960) return null;
    if (!(value.controller_agent_id === null || (typeof value.controller_agent_id === "string" && AGENT_ID.test(value.controller_agent_id)))) return null;
    if (!LIFECYCLES.has(value.lifecycle) || !Number.isSafeInteger(value.revision) || value.revision < 1) return null;
    if (!Number.isSafeInteger(value.updated_at_unix_ms)) return null;
    if (!(value.terminal_at_unix_ms === null || Number.isSafeInteger(value.terminal_at_unix_ms))) return null;
    for (const key of ["agent_task_count", "workflow_session_count"]) {
      if (!Number.isSafeInteger(value[key]) || value[key] < 0 || value[key] > 64) return null;
    }
    if (!validActivity(value.activity)) return null;
    if (!validContinuity(value.continuity)) return null;
    if (value.lifecycle === "active" && value.activity.state === "not_applicable") return null;
    if (value.lifecycle !== "active" && value.activity.state !== "not_applicable") return null;
    if (value.lifecycle === "active" && value.continuity.state === "not_applicable") return null;
    if (value.lifecycle !== "active" && value.continuity.state !== "not_applicable") return null;
    if (value.controller_agent_id === null && value.lifecycle === "active" && value.continuity.state !== "not_configured") return null;
    if (value.controller_agent_id !== null && value.lifecycle === "active" && value.continuity.state === "not_configured") return null;
    return value;
  }

  function callToolResultOf(result) {
    if (!result || typeof result !== "object" || Array.isArray(result)) return result;
    const nested = result.result;
    if (nested && typeof nested === "object" && !Array.isArray(nested) && (
      nested.structuredContent || nested.structured_content || Array.isArray(nested.content)
      || typeof nested.success === "boolean" || Object.prototype.hasOwnProperty.call(nested, "isError")
    )) return nested;
    return result;
  }

  function extractPlan(result) {
    const callResult = callToolResultOf(result);
    const structured = callResult && (callResult.structuredContent || callResult.structured_content || callResult);
    const output = structured && (structured.output || structured);
    if (!callResult || callResult.isError || !structured || structured.success === false) return null;
    return validPlan(output && output.goal_plan);
  }

  function labelLifecycle(value) {
    return value === "active" ? "Active" : value === "completed" ? "Completed" : "Cancelled";
  }

  function formatQuiet(ms) {
    if (!Number.isSafeInteger(ms) || ms < 0) return "an unknown interval";
    if (ms < 60000) return "less than 1m";
    const minutes = Math.floor(ms / 60000);
    if (minutes < 60) return `${minutes}m`;
    const hours = Math.floor(minutes / 60);
    const remainder = minutes % 60;
    return remainder === 0 ? `${hours}h` : `${hours}h ${remainder}m`;
  }

  function renderActivity(activity) {
    const node = el("activity");
    node.hidden = false;
    node.className = `activity activity-${activity.state}`;
    if (activity.state === "not_applicable") {
      node.textContent = "Window activity observation is not applicable to this terminal Goal.";
      return;
    }
    if (!activity.available) {
      node.textContent = "Window activity observation unavailable.";
      return;
    }
    if (activity.state === "unobserved") {
      node.textContent = activity.coverage_partial
        ? "Window activity evidence is partial; no inactivity conclusion is safe."
        : "No observable correlated Window activity yet.";
      return;
    }
    if (activity.state === "active") {
      node.textContent = (activity.active_meaningful_request_count || 0) > 0
        ? "Meaningful WebCodex work is currently running."
        : "Meaningful WebCodex activity was observed recently.";
      return;
    }
    const quiet = formatQuiet(activity.quiet_for_ms);
    // A historical observation does not establish that a card is still alive.
    // Only Server-owned reconciliation inside goal_plan_sync may decide continuation eligibility.
    node.textContent = `No meaningful WebCodex activity for ${quiet}. This Goal may need attention; this does not establish that the Window is offline.`;
  }

  function continuityLabel(value) {
    return {
      ready: "Ready", stalled: "Stalled", wake_queued: "Wake queued",
      dispatching: "Dispatching", host_accepted: "Host accepted",
      host_unknown: "Host outcome unknown", resume_confirmed: "Resume confirmed",
      not_configured: "Not configured", not_applicable: "Not applicable",
      unavailable: "Unavailable",
    }[value] || "Unavailable";
  }

  function wakeLabel(value) {
    return value === null ? "—" : {
      pending: "Pending", claimed: "Claimed", prepared: "Prepared",
      delivered: "Delivered", delivery_unknown: "Delivery unknown",
      consumed: "Consumed", retired: "Retired",
    }[value] || "—";
  }

  function hostDeliveryLabel(value) {
    return {
      not_started: "Not started", dispatching: "Dispatching", accepted: "Accepted",
      unknown: "Unknown", not_confirmed: "Not confirmed", not_applicable: "Not applicable",
    }[value] || "Not applicable";
  }

  function renderContinuity(continuity) {
    el("continuity").hidden = false;
    el("auto-resume").textContent = continuity.state === "not_configured" ? "Not configured"
      : continuity.state === "not_applicable" ? "Not applicable"
      : continuity.production_auto_resume_available ? "Ready" : "Not ready";
    el("continuity-state").textContent = continuityLabel(continuity.state);
    el("wake-state").textContent = wakeLabel(continuity.wake_state);
    el("host-delivery").textContent = hostDeliveryLabel(continuity.host_delivery);
    el("fresh-turn").textContent = continuity.fresh_turn === "confirmed" ? "Confirmed"
      : continuity.fresh_turn === "not_confirmed" ? "Not confirmed" : "Not applicable";
    const resumedAt = continuity.last_resume_at_unix_ms;
    if (resumedAt === null) {
      el("last-resume").textContent = "—";
    } else {
      const date = new Date(resumedAt);
      el("last-resume").textContent = Number.isNaN(date.getTime()) ? "Confirmed" : `Confirmed · ${date.toLocaleString()}`;
    }
  }

  function render(plan) {
    if (tornDown) return;
    el("title").textContent = plan.title;
    el("lifecycle").textContent = labelLifecycle(plan.lifecycle);
    const currentIndex = plan.steps.findIndex(step => step.id === plan.current_step_id);
    el("progress").textContent = currentIndex >= 0
      ? `Step ${currentIndex + 1} / ${plan.total_step_count}`
      : `${plan.completed_step_count} / ${plan.total_step_count} steps complete`;
    el("steps").textContent = plan.steps.map(step => `${step.status === "completed" ? "✓" : step.status === "in_progress" ? "→" : "  "} ${step.title}`).join("\n");
    el("checkpoint").textContent = plan.progress_summary === null ? "No checkpoint yet" : `Last checkpoint: ${plan.progress_summary}`;
    el("tasks").textContent = String(plan.agent_task_count);
    el("sessions").textContent = String(plan.workflow_session_count);
    el("controller").textContent = plan.controller_agent_id || "Not configured";
    el("revision").textContent = String(plan.revision);
    const date = new Date(plan.updated_at_unix_ms);
    el("updated").textContent = Number.isNaN(date.getTime()) ? "—" : date.toLocaleString();
    el("meta").hidden = false;
    renderActivity(plan.activity);
    renderContinuity(plan.continuity);
    if (hostInitialized) showTrackingStatus();
  }

  function showTrackingStatus() {
    el("status").textContent = lastLifecycle === null ? "Exact identity received · reading authoritative Goal state"
      : lastLifecycle === "active" ? "Tracking authoritative Goal state" : "Terminal Goal state";
  }

  function isTerminal() {
    return lastLifecycle !== null && lastLifecycle !== "active";
  }

  function stopPolling() {
    if (pollTimer !== null) clearTimeout(pollTimer);
    pollTimer = null;
  }

  function nextPollDelay(plan) {
    if (document.hidden) return HIDDEN_POLL_MS;
    if (!plan) return VISIBLE_NORMAL_POLL_MS;
    const continuity = plan.continuity;
    if (["wake_queued", "dispatching", "host_accepted", "host_unknown"].includes(continuity.state)) {
      return TRANSIENT_POLL_MS;
    }
    const quiet = plan.activity.quiet_for_ms;
    if (Number.isSafeInteger(quiet)
      && plan.activity.idle_threshold_ms - quiet <= NEAR_ATTENTION_WINDOW_MS) {
      return TRANSIENT_POLL_MS;
    }
    return VISIBLE_NORMAL_POLL_MS;
  }

  function schedulePoll(delayMs) {
    stopPolling();
    if (!hostInitialized || !goalId || isTerminal() || tornDown) return;
    pollTimer = setTimeout(() => {
      pollTimer = null;
      void poll();
    }, delayMs);
  }

  async function poll() {
    if (tornDown || !hostInitialized || !goalId || isTerminal() || pollInFlight) return;
    pollInFlight = true;
    try {
      // One effectful App primitive owns observation, authoritative stall
      // reconciliation, and the final projection. No conditional second RPC.
      const response = await send("tools/call", { name: "goal_plan_sync", arguments: { goal_id: goalId } });
      const plan = extractPlan(response);
      if (!plan || !acceptIdentity(plan.goal_id)) throw new Error("Invalid Goal Plan state");
      if (plan.revision < lastRevision || (plan.revision === lastRevision && lastLifecycle !== null && plan.lifecycle !== lastLifecycle)) {
        throw new Error("Stale or inconsistent Goal Plan state");
      }
      lastRevision = plan.revision;
      lastLifecycle = plan.lifecycle;
      lastPlan = plan;
      render(plan);
    } catch (_) {
      if (!tornDown) el("status").textContent = "State refresh pending";
    } finally {
      pollInFlight = false;
      if (isTerminal()) stopPolling();
      else if (!tornDown && hostInitialized && goalId) schedulePoll(nextPollDelay(lastPlan));
    }
  }

  function ensurePolling() {
    if (!hostInitialized || !goalId || isTerminal() || tornDown) return stopPolling();
    showTrackingStatus();
    if (!pollInFlight && pollTimer === null) void poll();
  }

  function acceptToolInput(params) {
    // MCP Apps 2026-01-26 supplies complete arguments here, never authority.
    const args = params && params.arguments;
    if (!acceptIdentity(args && !Array.isArray(args) && args.goal_id)) return;
    ensurePolling();
  }

  function acceptToolResult(result) {
    if (tornDown) return;
    const plan = extractPlan(result);
    if (!plan || !acceptIdentity(plan.goal_id)) return;
    if (plan.revision >= lastRevision && (lastLifecycle === null || plan.revision > lastRevision || plan.lifecycle === lastLifecycle)) {
      lastRevision = plan.revision;
      lastLifecycle = plan.lifecycle;
      render(plan);
    }
    ensurePolling();
  }

  function teardown() {
    tornDown = true;
    stopPolling();
    for (const entry of pending.values()) {
      clearTimeout(entry.timer);
      entry.reject(new Error("App torn down"));
    }
    pending.clear();
  }

  addEventListener("message", event => {
    if (event.source !== parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (Object.prototype.hasOwnProperty.call(msg, "id") && pending.has(msg.id)) {
      const entry = pending.get(msg.id);
      pending.delete(msg.id);
      clearTimeout(entry.timer);
      if (msg.error) entry.reject(new Error(String(msg.error.message || "Host error")));
      else entry.resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-input") {
      acceptToolInput(msg.params);
      return;
    }
    if (msg.method === "ui/notifications/tool-result") {
      acceptToolResult(msg.params);
      return;
    }
    if (msg.method === "ui/resource-teardown") {
      teardown();
      if (Object.prototype.hasOwnProperty.call(msg, "id")) {
        parent.postMessage({ jsonrpc: "2.0", id: msg.id, result: {} }, "*");
      }
    }
  });

  addEventListener("visibilitychange", () => {
    if (tornDown || isTerminal()) return;
    if (document.hidden) schedulePoll(HIDDEN_POLL_MS);
    else {
      stopPolling();
      if (!pollInFlight) void poll();
    }
  });
  addEventListener("pagehide", teardown, { once: true });
  addEventListener("beforeunload", teardown, { once: true });

  send("ui/initialize", { protocolVersion: APP_PROTOCOL, appInfo: { name: "webcodex-goal-plan-app", title: "WebCodex Goal Plan", version: "6.0.0" }, appCapabilities: {} })
    .then(() => {
      if (tornDown) return;
      hostInitialized = true;
      if (goalId) showTrackingStatus();
      else el("status").textContent = "Host initialized · waiting for exact tool identity";
      notify("ui/notifications/initialized", {});
      ensurePolling();
    })
    .catch(() => { if (!tornDown) el("status").textContent = "Host initialization unavailable"; });
})();
</script>
</body>
</html>
