version = 1

[layers]
leaf = 0
domain = 1
runtime = 2
application = 3
composition = 4
entrypoint = 5

[root_test_support]
feature = "root-test-support"
providers = [
    "webcodex-runner-registry",
    "webcodex-store",
    "webcodex-tool-contracts",
    "webcodex-workflow-session",
]

[forbidden_external_dependencies]
webcodex-cli = ["quinn", "rusqlite", "salvo"]
webcodex-core = ["quinn", "rusqlite", "salvo"]
webcodex-runner = ["rusqlite", "salvo"]

[packages.webcodex]
layer = "composition"
role = "Server composition and protocol adapters."
normal = [
    "webcodex-admin",
    "webcodex-code-mode",
    "webcodex-core",
    "webcodex-environment",
    "webcodex-persistent-shell",
    "webcodex-runner-config",
    "webcodex-runner-registry",
    "webcodex-store",
    "webcodex-tool-contracts",
    "webcodex-tool-runtime-contracts",
    "webcodex-validation",
    "webcodex-workflow-session",
    "webcodex-workspace",
]
dev = [
    "webcodex-runner-registry",
    "webcodex-store",
    "webcodex-tool-contracts",
    "webcodex-workflow-session",
]
build = []
test_support = [
    "webcodex-runner-registry",
    "webcodex-store",
    "webcodex-tool-contracts",
    "webcodex-workflow-session",
]

[packages.webcodex-admin]
layer = "leaf"
role = "Standalone operator/admin HTTP client support."
normal = []
dev = []
build = []
test_support = []

[packages.webcodex-browser]
layer = "domain"
role = "First-class bounded CDP browser runtime built on process lifecycle primitives."
normal = ["webcodex-process"]
dev = []
build = []
test_support = []

[packages.webcodex-cli]
layer = "entrypoint"
role = "User-facing CLI entrypoint over server composition and shared setup helpers."
normal = [
    "webcodex",
    "webcodex-admin",
    "webcodex-core",
    "webcodex-environment",
    "webcodex-runner-config",
]
dev = []
build = []
test_support = []

[packages.webcodex-code-mode]
layer = "runtime"
role = "Experimental transport-neutral Code Mode frontend/runtime and bounded V8 orchestration."
normal = []
dev = []
build = []
test_support = []

[packages.webcodex-computer]
layer = "leaf"
role = "Platform-native computer-use primitives."
normal = ["webcodex-core"]
dev = []
build = []
test_support = []

[packages.webcodex-core]
layer = "leaf"
role = "Shared contracts and low-level helpers with no workspace dependencies."
normal = []
dev = []
build = []
test_support = []

[packages.webcodex-environment]
layer = "runtime"
role = "Shared environment setup, recovery, and persistent service lifecycle."
normal = [
    "webcodex-admin",
    "webcodex-core",
    "webcodex-runner-config",
]
dev = []
build = []
test_support = []

[packages.webcodex-lsp]
layer = "domain"
role = "Native bounded Language Server Protocol lifecycle and semantic navigation."
normal = [
    "webcodex-core",
    "webcodex-process",
    "webcodex-runner-config",
]
dev = []
build = []
test_support = []

[packages.webcodex-persistent-shell]
layer = "domain"
role = "Persistent local shell lifecycle built on process primitives."
normal = ["webcodex-process"]
dev = []
build = []
test_support = []

[packages.webcodex-process]
layer = "leaf"
role = "OS process-tree ownership and lifecycle primitives."
normal = []
